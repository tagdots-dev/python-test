---
name: re-build-test

on: # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      ARTIFACT_ID:
        value: ${{ jobs.build.outputs.ARTIFACT_ID }}

      BUILD_VERSION:
        value: ${{ jobs.build.outputs.BUILD_VERSION }}

      WORKFLOW_RUN_ID:
        value: ${{ jobs.build.outputs.WORKFLOW_RUN_ID }}

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14.x"

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      ARTIFACT_ID: ${{ steps.set-artifact-id.outputs.ARTIFACT_ID }}
      BUILD_VERSION: ${{ steps.set-build-version.outputs.BUILD_VERSION }}
      WORKFLOW_RUN_ID: ${{ steps.set-workflow-runid.outputs.WORKFLOW_RUN_ID }}

    steps:
      - name: Checkout source code # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python # https://github.com/marketplace/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Make build
        run: make build

      - name: Set Build Version
        id: set-build-version
        run: |
          echo "BUILD_VERSION=$(python src/*/cli.py --version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Get Build Version
        id: get-build-version
        run: |
          echo "Build Version: ${{ steps.set-build-version.outputs.BUILD_VERSION }}"

      - name: Upload distributions # https://github.com/marketplace/actions/upload-artifact
        if: ${{ !env.ACT }}
        id: upload-distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: distributions-${{ env.PYTHON_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 6

      - name: Set output artifact ID
        if: ${{ !env.ACT }}
        id: set-artifact-id
        shell: bash
        run: |
          echo "ARTIFACT_ID=${{ steps.upload-distributions.outputs.artifact-id }}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ID: ${{ steps.upload-distributions.outputs.artifact-id }}"

      - name: Set output workflow run ID
        if: ${{ !env.ACT }}
        id: set-workflow-runid
        shell: bash
        run: |
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "Workflow Run ID: ${{ github.run_id }}"

  test:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout source code # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python # https://github.com/marketplace/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make test-install

      - name: Make Test
        run: make test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Upload coverage # https://github.com/marketplace/actions/upload-artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage-result
          path: htmlcov/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 6
