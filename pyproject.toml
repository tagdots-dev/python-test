[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pkg-15903"
version = "0.1.100"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [
  { name = "developers", email = "developers@tagdots.com" },
]
requires-python = ">=3.12.10"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "click==8.4.2",
  "fastapi[standard]==0.141.1",
  "fastapi-health==0.4.0",
  "pkg-19544==1.4.1",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "requests==2.34.2",
]
optional-dependencies.local = [
  "commitizen",
  "pre-commit",
]
optional-dependencies.test = [
  "build",
  "coverage",
  "flake8",
  "isort",
  "pysentry-rs",
  "twine",
]
urls.Changelog = "https://www.notavailable.com/changelog"
urls.Documentation = "https://www.notavailable.com/doc"
urls.Homepage = "https://www.notavailable.com"
scripts.pkg-15903 = "pkg_15903.cli:main"

[dependency-groups]
test = [
  "coverage[toml]",
]

[tool.hatch]
version.path = "src/pkg_15903/__init__.py"
metadata.directory = "src"
build.targets.wheel.packages = [ "src/pkg_15903" ]

[tool.black]
line-length = 125

[tool.isort]
profile = "black"

[tool.pyproject-fmt]
column_width = 125
indent = 2
keep_full_version = true

[tool.coverage]
run.branch = true
run.command_line = "-m pytest -vs tests/"
run.omit = [ "tests/*" ]
run.source = [ "src/pkg_80243" ]
report.fail_under = 80
report.show_missing = false

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
  "src/pkg_80243/__init__.py:__version__",
]
major_version_zero = false
tag_format = "$version"
update_changelog_on_bump = true
